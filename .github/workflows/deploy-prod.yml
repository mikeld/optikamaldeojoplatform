name: Deploy Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: hostinger-prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: facturas-src/package-lock.json

      - name: Prepare release
        env:
          DB_NAME: u373487989_maldeojo
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASS: ${{ secrets.PROD_DB_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./deploy/prepare_hostinger_release.sh prod deploy/dist/release

      - name: Create ZIP package and prepare unzip script
        run: |
          set -euo pipefail
          # Comprimir el release generado
          cd deploy/dist/release
          zip -qr ../release.zip .
          cd ../../..

          # Generar un token dinámico de un solo uso
          UNZIP_TOKEN=$(openssl rand -hex 16)
          echo "UNZIP_TOKEN=$UNZIP_TOKEN" >> $GITHUB_ENV

          # Copiar la plantilla unzip.php y reemplazar el token
          cp deploy/unzip.php deploy/dist/unzip.php
          sed -i "s/COMPARE_WITH_TOKEN/$UNZIP_TOKEN/g" deploy/dist/unzip.php

      - name: Upload to Hostinger production (HTTP)
        env:
          UPLOAD_TOKEN: ${{ secrets.DEPLOY_UPLOAD_TOKEN }}
          SITE_URL: https://sienna-woodpecker-278479.hostingersite.com
        run: |
          test -n "$UPLOAD_TOKEN"

          echo "Uploading release.zip via HTTP..."
          curl --fail --show-error --retry 3 --retry-delay 10 --max-time 600 \
            -F "file=@deploy/dist/release.zip" \
            "$SITE_URL/upload_receiver.php?token=$UPLOAD_TOKEN&filename=release.zip"

          echo ""
          echo "Uploading unzip.php via HTTP..."
          curl --fail --show-error --retry 3 --retry-delay 10 --max-time 120 \
            -F "file=@deploy/dist/unzip.php" \
            "$SITE_URL/upload_receiver.php?token=$UPLOAD_TOKEN&filename=unzip.php"

      - name: Trigger Remote Unzip
        env:
          SITE_URL: https://sienna-woodpecker-278479.hostingersite.com
        run: |
          echo "Triggering unzip..."
          RESPONSE=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "$SITE_URL/unzip.php?token=${{ env.UNZIP_TOKEN }}")
          echo "Server response: $RESPONSE"
          if [[ $(echo "$RESPONSE" | jq -r '.status') != "success" ]]; then
            echo "Unzip failed: $RESPONSE"
            exit 1
          fi
