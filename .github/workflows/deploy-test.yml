name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: hostinger-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: facturas-src/package-lock.json

      - name: Prepare release
        env:
          DB_NAME: u373487989_maldeojotest
          DB_USER: ${{ secrets.TEST_DB_USER }}
          DB_PASS: ${{ secrets.TEST_DB_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./deploy/prepare_hostinger_release.sh test deploy/dist/release

      - name: Prepare incremental upload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          rm -rf deploy/dist/upload
          mkdir -p deploy/dist/upload

          if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            cp -a deploy/dist/release/. deploy/dist/upload/
            exit 0
          fi

          git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > deploy/dist/changed_files.txt

          if grep -Eq '^(facturas-src/|package.json|package-lock.json|vite.config|tsconfig)' deploy/dist/changed_files.txt; then
            mkdir -p deploy/dist/upload/facturas
            cp -a deploy/dist/release/facturas/. deploy/dist/upload/facturas/
          fi

          while IFS= read -r file; do
            case "$file" in
              assets/*|includes/*|pedidos/*|home.php|index.php|logout.php|manifest.json|offline.html|sw.js)
                if [ -f "deploy/dist/release/$file" ]; then
                  mkdir -p "deploy/dist/upload/$(dirname "$file")"
                  cp "deploy/dist/release/$file" "deploy/dist/upload/$file"
                fi
                ;;
            esac
          done < deploy/dist/changed_files.txt

          for file in includes/db_config.php pedidos/api/facturas.php pedidos/views/header.php pedidos/assets/css/style.css; do
            if [ -f "deploy/dist/release/$file" ]; then
              mkdir -p "deploy/dist/upload/$(dirname "$file")"
              cp "deploy/dist/release/$file" "deploy/dist/upload/$file"
            fi
          done

          if ! find deploy/dist/upload -type f | grep -q .; then
            cp -a deploy/dist/release/. deploy/dist/upload/
          fi

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to Hostinger test
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.HOSTINGER_TEST_DIR }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          test -n "$FTP_DIR"
          FTP_HOST_CLEAN="$(printf '%s' "${FTP_HOST#ftp://}" | tr -d '\r\n')"
          FTP_USER_CLEAN="$(printf '%s' "$FTP_USER" | tr -d '\r\n')"
          FTP_PASS_CLEAN="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_DIR_CLEAN="$(printf '%s' "$FTP_DIR" | tr -d '\r\n')"
          FILE_COUNT="$(find deploy/dist/upload -type f | wc -l | tr -d ' ')"

          for attempt in 1 2 3; do
            echo "FTP upload attempt $attempt/3"

            {
              echo "set cmd:fail-exit yes"
              echo "set net:timeout 120"
              echo "set net:max-retries 2"
              echo "set net:reconnect-interval-base 6"
              echo "set ftp:ssl-allow true"
              echo "set ftp:passive-mode true"
              echo "set ssl:verify-certificate no"
              echo "open -p 21 -u \"$FTP_USER_CLEAN\",\"$FTP_PASS_CLEAN\" \"$FTP_HOST_CLEAN\""

              echo "# Using direct file upload for $FILE_COUNT files"
              while IFS= read -r file; do
                rel="${file#deploy/dist/upload/}"
                remote_dir="$FTP_DIR_CLEAN/$(dirname "$rel")"
                echo "put -O \"$remote_dir\" \"$file\""
              done < <(find deploy/dist/upload -type f | sort)

              echo "bye"
            } > deploy/dist/lftp_commands.txt

            if timeout 360 lftp -f deploy/dist/lftp_commands.txt
            then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 20
          done
