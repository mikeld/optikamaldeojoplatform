name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: hostinger-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: facturas-src/package-lock.json

      - name: Prepare release
        env:
          DB_NAME: u373487989_maldeojotest
          DB_USER: ${{ secrets.TEST_DB_USER }}
          DB_PASS: ${{ secrets.TEST_DB_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./deploy/prepare_hostinger_release.sh test deploy/dist/release

      - name: Create ZIP package and prepare unzip script
        run: |
          set -euo pipefail
          # Comprimir el release generado
          cd deploy/dist/release
          zip -qr ../release.zip .
          cd ../../..

          # Generar un token dinámico de un solo uso
          UNZIP_TOKEN=$(openssl rand -hex 16)
          echo "UNZIP_TOKEN=$UNZIP_TOKEN" >> $GITHUB_ENV

          # Copiar la plantilla unzip.php y reemplazar el token
          cp deploy/unzip.php deploy/dist/unzip.php
          sed -i "s/COMPARE_WITH_TOKEN/$UNZIP_TOKEN/g" deploy/dist/unzip.php

      - name: Upload to Hostinger test
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.HOSTINGER_TEST_DIR }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASS"
          test -n "$FTP_DIR"
          FTP_HOST_CLEAN="$(printf '%s' "${FTP_HOST#ftp://}" | tr -d '\r\n')"
          FTP_USER_CLEAN="$(printf '%s' "$FTP_USER" | tr -d '\r\n')"
          FTP_PASS_CLEAN="$(printf '%s' "$FTP_PASS" | tr -d '\r\n')"
          FTP_DIR_CLEAN="$(printf '%s' "$FTP_DIR" | tr -d '\r\n')"

          echo "Uploading release.zip..."
          curl --fail --silent --show-error --ftp-create-dirs --retry 3 --connect-timeout 60 --max-time 600 --user "$FTP_USER_CLEAN:$FTP_PASS_CLEAN" -T "deploy/dist/release.zip" "ftp://$FTP_HOST_CLEAN/$FTP_DIR_CLEAN/release.zip"

          echo "Uploading unzip.php..."
          curl --fail --silent --show-error --ftp-create-dirs --retry 3 --connect-timeout 60 --max-time 600 --user "$FTP_USER_CLEAN:$FTP_PASS_CLEAN" -T "deploy/dist/unzip.php" "ftp://$FTP_HOST_CLEAN/$FTP_DIR_CLEAN/unzip.php"

      - name: Trigger Remote Unzip
        run: |
          echo "Triggering unzip..."
          # Realizar curl llamando al script de descompresión con el token dinámico
          RESPONSE=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://sienna-woodpecker-278479.hostingersite.com/test/unzip.php?token=${{ env.UNZIP_TOKEN }}")
          echo "Server response: $RESPONSE"
          if [[ $(echo "$RESPONSE" | jq -r '.status') != "success" ]]; then
            echo "Unzip failed!"
            exit 1
          fi
